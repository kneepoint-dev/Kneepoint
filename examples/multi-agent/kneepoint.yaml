target:
  type: openai-compatible
  url: http://127.0.0.1:8765/v1
  model: lantern-desk
workload:
  ramp: {from: 1, to: 16, step: 3, hold_seconds: 15}
  conversation:
    turns: {min: 1, max: 1}
    corpus: ./prompts/*.txt
    retry: {max_attempts: 1, backoff_s: 0}
resolution:
  check: {kind: regex, value: '\[RESOLVED kb-\d+\]'}
cost:
  input_per_mtok: 0
  output_per_mtok: 0
chaos:
  profile: "off"
