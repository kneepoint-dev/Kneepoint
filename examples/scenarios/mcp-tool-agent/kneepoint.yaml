# Agent with MCP tools: load-test the agent's front door, chaos its tool calls.
# kneepoint speaks to the AGENT over its OpenAI-compatible endpoint; the
# agent's HTTP-transported MCP tool traffic is faulted through the chaos
# proxy. A native MCP target adapter is on the roadmap (docs/roadmap.md).
# Run: kneepoint run --scenario examples/scenarios/mcp-tool-agent/kneepoint.yaml

target:
  type: openai-compatible
  url: http://127.0.0.1:8000/v1
  model: mock

workload:
  ramp: {from: 1, to: 30, step: 5, hold_seconds: 20}
  conversation:
    turns: {min: 1, max: 3}
    corpus: ./prompts/*.txt

resolution:
  check: {kind: contains, value: "[RESOLVED"}

cost:
  input_per_mtok: 3.00
  output_per_mtok: 15.00
  max_spend: 5.00

chaos:
  profile: custom                   # every fault a flaky tool server produces
  faults:
    - {type: tool_timeout, probability: 0.10}
    - {type: tool_malformed_json, probability: 0.05}
    - {type: llm_rate_limit, probability: 0.02}
    - {type: llm_server_error, probability: 0.01}

slo:
  min_resolution_rate: 0.80
