name: nightly-demo
on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:
jobs:
  demo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install -e .
      - run: kneepoint demo --no-open --hold-seconds 10 --out reports
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nightly-demo-report
          path: reports/
          retention-days: 14
