name: docs
# Manual-dispatch only for now: GitHub Pages cannot serve a PRIVATE repo on the
# free org plan, so an automatic deploy would publish a gh-pages branch that
# nothing serves. When the repo goes public (launch), restore the push trigger:
#   push:
#     branches: [main]
#     paths: ["docs/**", "mkdocs.yml", ".github/workflows/docs.yml"]
on:
  workflow_dispatch:
permissions:
  contents: read

jobs:
  deploy:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with: {python-version: "3.12"}
      - run: pip install -e ".[docs]"
      - run: mkdocs gh-deploy --force
