name: docs
# Manual-dispatch only for now: GitHub Pages cannot serve a PRIVATE repo on the
# free org plan, so an automatic deploy would publish a gh-pages branch that
# nothing serves. When the repo goes public (launch), restore the push trigger:
#   push:
#     branches: [main]
#     paths: ["docs/**", "mkdocs.yml", ".github/workflows/docs.yml"]
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install -e ".[docs]"
      - run: mkdocs gh-deploy --force
