name: Feature request
description: A capability kneepoint should have.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes: {label: The problem, description: "What are you trying to learn about your agent that you can't today?"}
    validations: {required: true}
  - type: textarea
    id: proposal
    attributes: {label: Proposed behavior}
    validations: {required: true}
  - type: textarea
    id: alternatives
    attributes: {label: Workarounds you've tried}
